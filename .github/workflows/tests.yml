name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # Mongo va como replica set de un nodo, igual que en el Codespace: sin
      # eso no hay transacciones y la integración de q14 se saltearía. Los
      # services de Actions no dejan pasar --replSet, por eso se levanta a mano.
      - name: Levantar Mongo (replica set)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7.0 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}) } quit(db.hello().isWritablePrimary ? 0 : 1)"; then
              exit 0
            fi
            sleep 2
          done
          echo "Mongo no quedó primario" && exit 1
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Correr los tests
        run: pytest -rs
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/?directConnection=true
