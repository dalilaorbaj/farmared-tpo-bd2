services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    environment:
      MONGO_URI: mongodb://mongo:27017/?directConnection=true
      MONGO_DB: farmared
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Mongo corre como replica set de un solo nodo porque las transacciones
  # multi-documento (las usamos en el registro de ventas) no funcionan en un standalone.
  # El healthcheck inicializa el replica set la primera vez y recién da el
  # servicio por sano cuando el nodo ya es primario (antes no acepta escrituras
  # y la carga del postCreateCommand fallaría).
  mongo:
    image: mongo:7.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}) } quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  redis:
    image: redis:7.4
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mongo_data:
  redis_data:
